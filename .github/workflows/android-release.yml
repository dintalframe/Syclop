name: Build Android TV Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview metadata, create a draft, or publish the release
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: dry-run
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Review Android TV release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
      current_bump: ${{ steps.release.outputs.current_bump }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tooling
        run: |
          bash -n scripts/generate-release-notes.sh scripts/release-metadata.sh
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v

      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

          unexpected_changes="$(
            git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
              | grep -Ev '^(\.github/workflows/(android-release|beta-release)\.yml|scripts/release-metadata\.sh|scripts/generate-release-notes\.sh|scripts/generate_release_notes\.py|scripts/release_notes/.*|scripts/tests/.*)$' \
              || true
          )"
          if [[ -n "${unexpected_changes}" ]]; then
            echo "The version bump must be the final application change before release." >&2
            echo "Unexpected files changed after the bump:" >&2
            echo "${unexpected_changes}" >&2
            exit 1
          fi


      - name: Generate release notes
        env:
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          generation_status=0
          reviewed_path="scripts/release_notes/reviewed/${RELEASE_VERSION}.md"
          reviewed_entry="$(git ls-tree "${RELEASE_COMMIT}" -- "${reviewed_path}")"
          if [[ -n "${reviewed_entry}" ]]; then
            if [[ "${reviewed_entry}" != "100644 blob "* || -n "${EXCLUDE_COMMITS}" ]]; then
              echo "Reviewed release notes must be a regular file and cannot be combined with commit exclusions." >&2
              exit 1
            fi
            git show "${RELEASE_COMMIT}:${reviewed_path}" > release-notes.md
            if ! grep -q '^- [^[:space:]]' release-notes.md || grep -qi 'release notes pending' release-notes.md; then
              echo "Reviewed release notes must contain user-facing changes." >&2
              exit 1
            fi
            printf '# Release-note quality report\n\nStatus: **CURATED**\n\nSource: %s at %s.\n'               "${reviewed_path}" "${RELEASE_COMMIT}" > release-note-quality.md
          else
            release_note_args=(
              --from "${PREVIOUS_BUMP}"
              --to "${CURRENT_BUMP}"
              --repository "${GITHUB_REPOSITORY}"
              --exclude "${EXCLUDE_COMMITS}"
              --quality-report release-note-quality.md
            )
            if [[ "${RELEASE_MODE}" == "publish" ]]; then
              release_note_args+=(--strict)
            fi

            ./scripts/generate-release-notes.sh "${release_note_args[@]}" \
              > release-notes.md || generation_status=$?

            if [[ ! -s release-notes.md ]]; then
              if [[ "${generation_status}" -ne 0 || "${RELEASE_MODE}" == "publish" ]]; then
                echo "No release-note commits were found." >&2
                exit 1
              fi
              printf '%s\n' 'Release notes pending. Replace this text before publishing.' > release-notes.md
            fi
          fi

          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            {
              printf '%s\n' \
                '> [!IMPORTANT]' \
                '> **Beta builds are for testing purposes and may contain bugs, regressions, or unexpected issues.** If you prefer a reliable experience, we recommend staying on the **Stable** channel.' \
                ''
              cat release-notes.md
            } > release-notes.tmp
            mv release-notes.tmp release-notes.md
          fi

          {
            echo "## ${{ steps.release.outputs.title }}"
            echo
            cat release-notes.md
            echo
            cat release-note-quality.md
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${generation_status}"

      - name: Upload release-note review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: syclop-${{ steps.release.outputs.version }}-${{ inputs.mode }}-release-notes
          path: |
            release-notes.md
            release-note-quality.md
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Sign and ${{ inputs.mode }} Android TV release
    needs: review
    if: inputs.mode != 'dry-run'
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - name: Check out approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download reviewed release notes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: syclop-${{ needs.review.outputs.version }}-${{ inputs.mode }}-release-notes

      - name: Bind reviewed notes to release version
        env:
          RELEASE_VERSION: ${{ needs.review.outputs.version }}
        run: printf '%s\n' "${RELEASE_VERSION}" > release-notes.version

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-disabled: true

      - name: Configure release properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: |
          umask 077
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" || -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "Release properties and signing material must be configured in the release environment." >&2
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/syclop-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          if [[ -n "${LOCAL_DEV_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_DEV_PROPERTIES_BASE64}" | base64 --decode > local.dev.properties
          fi

          set_property() {
            local property_name="$1"
            local property_value="$2"
            [[ -n "${property_value}" ]] || return 0
            sed -i -E "/^[[:space:]]*${property_name}[[:space:]]*=/d" local.properties
            printf '\n%s=%s\n' "${property_name}" "${property_value}" >> local.properties
          }

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          set_property NUVIO_RELEASE_STORE_FILE "${keystore_path}"
          set_property NUVIO_RELEASE_KEY_ALIAS "${RELEASE_KEY_ALIAS}"
          set_property NUVIO_RELEASE_KEY_PASSWORD "${RELEASE_KEY_PASSWORD}"
          set_property NUVIO_RELEASE_STORE_PASSWORD "${RELEASE_STORE_PASSWORD}"

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
            TRAKT_CLIENT_ID
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^[[:space:]]*${property_name}[[:space:]]*=[[:space:]]*.+$" local.properties; then
              echo "Missing required property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Test updater and build full release APKs
        run: ./gradlew :app:testFullReleaseUnitTest --tests 'com.nuvio.tv.updater.*' :app:assembleFullRelease --stacktrace

      - name: Prepare updater release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/full/release/app-full-universal-release.apk release/syclop-release.apk
          cp app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk release/syclop-arm64-release.apk
          (cd release && sha256sum syclop-release.apk syclop-arm64-release.apk) > release/SHA256SUMS

      - name: Verify bundled release notes
        env:
          RELEASE_VERSION: ${{ needs.review.outputs.version }}
        run: |
          aapt_path="$(printf '%s\n' "${ANDROID_HOME}"/build-tools/*/aapt | sort -V | tail -n 1)"
          test -x "${aapt_path}"
          python3 scripts/verify_bundled_release_notes.py \
            --aapt "${aapt_path}" --version "${RELEASE_VERSION}" --notes release-notes.md \
            release/syclop-release.apk release/syclop-arm64-release.apk

      - name: Verify current release identity
        env:
          RELEASE_VERSION: ${{ needs.review.outputs.version }}
        run: |
          aapt_path="$(printf '%s\n' "${ANDROID_HOME}"/build-tools/*/aapt | sort -V | tail -n 1)"
          apksigner_path="$(dirname "${aapt_path}")/apksigner"
          test -x "${aapt_path}"
          test -x "${apksigner_path}"
          python3 scripts/verify_release_identity.py \
            --aapt "${aapt_path}" --apksigner "${apksigner_path}" \
            --version "${RELEASE_VERSION}" --source-commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" --native-manifest SYCLOP_SOURCE_MANIFEST.json \
            --output release/release-identity.json \
            release/syclop-release.apk release/syclop-arm64-release.apk

      - name: Clean release signing files
        if: always()
        run: rm -f -- local.properties local.dev.properties "${RUNNER_TEMP}/syclop-release.jks"

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: syclop-${{ needs.review.outputs.version }}-full-release
          path: |
            release/*.apk
            release/SHA256SUMS
            release/release-identity.json
            release-notes.md
            release-notes.version
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ needs.review.outputs.tag }}
          RELEASE_TITLE: ${{ needs.review.outputs.title }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_PRERELEASE: ${{ needs.review.outputs.prerelease }}
        run: |
          release_apks=(release/syclop-release.apk release/syclop-arm64-release.apk release/SHA256SUMS release/release-identity.json release-notes.md release-notes.version)
          for asset in "${release_apks[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_TARGET}"
            --title "${RELEASE_TITLE}"
            --notes-file release-notes.md
          )
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          elif [[ "${RELEASE_MODE}" == "publish" ]]; then
            release_args+=(--latest)
          fi
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create "${release_args[@]}" "${release_apks[@]}"
