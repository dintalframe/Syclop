name: Syclop account return page

on:
  push:
    branches: [syclop]
    paths: ["docs/mal/**", ".github/workflows/syclop-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: syclop-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the public return-page files at this exact commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/mal
          for filename in index.html style.css relay.mjs relay-core.mjs relay-core.test.mjs README.md; do
            curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/docs/mal/${filename}" \
              --output "docs/mal/${filename}"
          done
      - name: Check return routing
        run: node --test docs/mal/relay-core.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the static page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
