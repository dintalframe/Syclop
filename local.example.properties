# Syclop standalone build example. Copy to the ignored local.properties file.
# See SYCLOP_BUILD.md for JDK/SDK paths and signing setup.
# LOCAL_ONLY_BUILD is fixed to true in app/build.gradle.kts, not a property here.
# No Supabase, upstream account backend or upstream updater configuration is needed.
# Never put viewer passwords, account tokens or signing material in this example.

# Public Syclop application registrations, not viewer credentials.
# Separately branded applications should register their own application identity.
TRAKT_CLIENT_ID=0nQc4G9CQfhwnM2g-8s1SsnLaTVO5CdN-qORYVpqKFg
TRAKT_REDIRECT_URI=https://github.com/dintalframe
MAL_CLIENT_ID=76daded66e7bb55596834840c1d73ebd
MAL_REDIRECT_URI=https://dintalframe.github.io/Syclop/mal/
SIMKL_CLIENT_ID=4e98516f315063630ed4ebf359c2faef8c13bf08a08f33f187826b5908accd5a
SIMKL_APP_NAME=syclop

# Optional maintainer-owned public registrations. Blank means unconfigured.
# Premiumize personal API-key entry does not require an application Client ID.
MDBLIST_CLIENT_ID=
PREMIUMIZE_CLIENT_ID=

# Optional: set to true only if you want to build the local ffmpeg-decoder-downmix module
USE_LOCAL_FFMPEG_DECODER=false
# Required only when USE_LOCAL_FFMPEG_DECODER=true
FFMPEG_SOURCE_DIR=path_to_ffmpeg_source_tree
FFMPEG_BUILD_DIR=path_to_ffmpeg_build_root

# --- DV7 / libdovi (Dolby Vision Profile 7 to 8.1) ---

# Build the dovi_bridge native lib + load the runtime bridge.
DOVI_NATIVE_ENABLED=true

# Marks extractor hook integration as available in the current build.
DOVI_EXTRACTOR_HOOK_READY=true

# Link the prebuilt libdovi static archive into dovi_bridge.
DOVI_ENABLE_REAL_LINK=true
# Optional explicit overrides (otherwise resolved from the prebuilt root below):
# DOVI_LIBDOVI_STATIC_LIB=/path/to/libdovi.a
# DOVI_LIBDOVI_INCLUDE_DIR=/path/to/libdovi/include
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi
